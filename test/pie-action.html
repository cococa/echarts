<html>
    <head>
        <meta charset="utf-8">
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <style>
            html, body, #main {
                width: 100%;
                height: 100%;
                margin: 0;
            }
            #main {
                background: #fff;
            }
        </style>

        <p>select</p>
        <button onclick="select('A')">A</button>
        <button onclick="select(1)">B</button>
        <p>unselect</p>
        <button onclick="unselect(0)">A</button>
        <button onclick="unselect('B')">B</button>

        <div id="main"></div>
        <script>

            require([
                'echarts'
            ], function (echarts) {


                chart = echarts.init(
                    document.getElementById('main'),
                    null,
                    {
                        renderer:'svg'
                    }
                );

                chart.setOption({
                    series: [{
                        type: 'pie',
                        selectedMode:'single',
                        itemStyle:{
                            decal: {
                                symbol: 'path://M512 42.666667a469.333333 469.333333 0 1 0 469.333333 469.333333A469.333333 469.333333 0 0 0 512 42.666667z m0 864a394.666667 394.666667 0 1 1 394.666667-394.666667 395.146667 395.146667 0 0 1-394.666667 394.666667z M338.72 425.973333m-80 0a80 80 0 1 0 160 0 80 80 0 1 0-160 0Z M685.28 425.973333m-80 0a80 80 0 1 0 160 0 80 80 0 1 0-160 0Z M512 711.626667a158.346667 158.346667 0 0 1-121.333333-56.586667 5.333333 5.333333 0 0 0-4.053334-1.92H309.92a5.333333 5.333333 0 0 0-4.8 7.733333 233.333333 233.333333 0 0 0 413.76 0 5.333333 5.333333 0 0 0-4.8-7.733333h-76.693333a5.333333 5.333333 0 0 0-4.053334 1.92A158.346667 158.346667 0 0 1 512 711.626667z',
                                color: 'rgba(0,0,0,0.9)',
                                // rotation: 90,
                                symbolKeepAspect: false,
                                dashArrayX: 6,
                                dashArrayY: 6
                                // symbolSize: 1
                            }
                        },
                        data: [{
                            value: 100,
                            name: 'A'
                        }, {
                            value: 200,
                            name: 'B'
                        }, {
                            value: 300,
                            name: 'C'
                        }, {
                            value: 400,
                            name: 'D'
                        }]
                    }]
                });
            });

            function select(name) {
                if (typeof name === 'string') {
                    chart.dispatchAction({
                        type: 'pieSelect',
                        name: name
                    });
                }
                else {
                    chart.dispatchAction({
                        type: 'pieSelect',
                        dataIndex: name
                    });
                }
            }

            function unselect(name) {
                if (typeof name === 'string') {
                    chart.dispatchAction({
                        type: 'pieUnSelect',
                        name: name
                    });
                }
                else {
                    chart.dispatchAction({
                        type: 'pieUnSelect',
                        dataIndex: name
                    });
                }
            }
        </script>
    </body>
</html>
