<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Roughness Helper Demo</title>
    <script src="lib/simpleRequire.js"></script>
    <script src="lib/config.js"></script>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/facePrint.js"></script>
    <script src="lib/testHelper.js"></script>
    <script src="lib/roughnessHelper.js"></script>
    <link rel="stylesheet" href="lib/reset.css" />
    <style>
        @font-face {
            font-family: 'JinNianYeYaoJiaYouYa';
            src: url('../JinNianYeYaoJiaYouYa-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 20px;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        .header h1 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .header p {
            margin: 0;
            color: #666;
        }

        .container {
            display: flex;
            height: calc(100vh - 100px);
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        .chart-wrapper:last-child {
            border-right: none;
        }

        .chart-title {
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            text-align: center;
            color: #333;
        }

        .chart {
            flex: 1;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>手绘风格图表 + 自定义字体示例</h1>
        <p>使用 roughnessHelper 辅助函数自动为手绘风格图表应用自定义字体</p>
    </div>

    <div class="container">
        <div class="chart-wrapper">
            <div class="chart-title">正常样式 (roughness: 0)</div>
            <div id="chart1" class="chart"></div>
        </div>
        <div class="chart-wrapper">
            <div class="chart-title">手绘风格 (roughness: 3)</div>
            <div id="chart2" class="chart"></div>
        </div>
        <div class="chart-wrapper">
            <div class="chart-title">手绘风格 (roughness: 5)</div>
            <div id="chart3" class="chart"></div>
        </div>
    </div>

    <script>
        require(['echarts'], function (echarts) {
            // 等待字体加载
            roughnessHelper.waitForFont('JinNianYeYaoJiaYouYa').then(function() {
                console.log('Custom font loaded');
                createCharts();
            });

            function createCharts() {
                // 基础配置
                const baseOption = {
                    title: {
                        text: '每周销售数据',
                        left: 'center',
                        top: 20,
                        textStyle: {
                            fontSize: 20
                        }
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    grid: {
                        left: '10%',
                        right: '10%',
                        bottom: '15%',
                        top: '20%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                        axisLabel: {
                            fontSize: 12
                        }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            fontSize: 12
                        }
                    },
                    series: [{
                        name: '销量',
                        type: 'bar',
                        data: [120, 200, 150, 80, 70, 110, 130],
                        itemStyle: {
                            borderWidth: 2,
                            borderColor: '#333'
                        },
                        label: {
                            show: true,
                            position: 'top',
                            fontSize: 12
                        }
                    }]
                };

                // 图表 1：正常样式
                const chart1 = echarts.init(document.getElementById('chart1'), null, {
                    renderer: 'canvas',
                    roughness: 0
                });
                
                const option1 = JSON.parse(JSON.stringify(baseOption));
                option1.series[0].itemStyle.color = '#5470c6';
                chart1.setOption(option1);

                // 图表 2：手绘风格 roughness=3
                const chart2 = roughnessHelper.createHandDrawnChart(
                    echarts,
                    document.getElementById('chart2'),
                    null,
                    {
                        renderer: 'canvas',
                        roughness: 3
                    }
                );
                
                const option2 = JSON.parse(JSON.stringify(baseOption));
                option2.series[0].itemStyle.color = '#91cc75';
                chart2.setOption(option2);

                // 图表 3：手绘风格 roughness=5
                const chart3 = roughnessHelper.createHandDrawnChart(
                    echarts,
                    document.getElementById('chart3'),
                    null,
                    {
                        renderer: 'canvas',
                        roughness: 5
                    }
                );
                
                const option3 = JSON.parse(JSON.stringify(baseOption));
                option3.series[0].itemStyle.color = '#ff6b6b';
                chart3.setOption(option3);

                console.log('All charts created');
                console.log('Chart 1 roughness:', chart1.getZr().roughness);
                console.log('Chart 2 roughness:', chart2.getZr().roughness);
                console.log('Chart 3 roughness:', chart3.getZr().roughness);
            }
        });
    </script>
</body>
</html>
