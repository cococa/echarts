<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Roughness with ZRender Font Integration</title>
    <script src="lib/simpleRequire.js"></script>
    <script src="lib/config.js"></script>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/facePrint.js"></script>
    <script src="lib/testHelper.js"></script>
    <link rel="stylesheet" href="lib/reset.css" />
    <style>
        @font-face {
            font-family: 'JinNianYeYaoJiaYouYa';
            src: url('../JinNianYeYaoJiaYouYa-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart" class="chart"></div>

    <script>
        require(['echarts'], function (echarts) {
            document.fonts.ready.then(function() {
                console.log('Font loaded');
                
                const chart = echarts.init(document.getElementById('chart'), null, {
                    renderer: 'canvas',
                    roughness: 5
                });

                const option = {
                    title: {
                        text: '手绘风格图表示例',
                        left: 'center',
                        top: 20,
                        textStyle: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif',
                            fontSize: 28,
                            color: '#333'
                        }
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    legend: {
                        data: ['销量'],
                        top: 60,
                        textStyle: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif',
                            fontSize: 14
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        top: 100,
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                        axisLabel: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif',
                            fontSize: 14,
                            color: '#666'
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#999'
                            }
                        }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif',
                            fontSize: 14,
                            color: '#666'
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#999'
                            }
                        },
                        splitLine: {
                            lineStyle: {
                                color: '#eee'
                            }
                        }
                    },
                    series: [{
                        name: '销量',
                        type: 'bar',
                        data: [120, 200, 150, 80, 70, 110, 130],
                        itemStyle: {
                            color: '#ff6b6b',
                            borderColor: '#333',
                            borderWidth: 2
                        },
                        label: {
                            show: true,
                            position: 'top',
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif',
                            fontSize: 14,
                            color: '#333'
                        }
                    }]
                };

                chart.setOption(option);
                
                console.log('Chart roughness:', chart.getZr().roughness);
                console.log('Chart filler:', chart.getZr().filler);
            });
        });
    </script>
</body>
</html>
