<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Roughness 柱状图调试</title>
    <script src="../lib/simpleRequire.js"></script>
    <script src="../lib/config.js"></script>
    <script src="../lib/jquery.min.js"></script>
    <script src="../lib/facePrint.js"></script>
    <script src="../lib/testHelper.js"></script>
    <link rel="stylesheet" href="../lib/reset.css" />
    <style>
        @font-face {
            font-family: 'JinNianYeYaoJiaYouYa';
            src: url('../../JinNianYeYaoJiaYouYa-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }
        select, button {
            padding: 5px 10px;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .value-display {
            display: inline-block;
            min-width: 40px;
            font-weight: bold;
            color: #2196F3;
        }
        #main {
            border: 2px solid #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>柱状图 Roughness 调试</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>渲染器 (Renderer):</label>
            <select id="renderer">
                <option value="canvas">Canvas</option>
                <option value="svg">SVG</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>粗糙度 (Roughness):</label>
            <input type="range" id="roughness" min="0" max="5" step="0.1" value="2.6">
            <span class="value-display" id="roughnessValue">2.6</span>
        </div>
        
        <div class="control-group">
            <label>填充样式 (Filler):</label>
            <select id="filler">
                <option value="hachure">Hachure (斜线)</option>
                <option value="solid">Solid (实心)</option>
                <option value="zigzag">Zigzag (锯齿)</option>
                <option value="cross-hatch">Cross-hatch (交叉线)</option>
                <option value="dots">Dots (点)</option>
                <option value="dashed">Dashed (虚线)</option>
                <option value="zigzag-line">Zigzag-line (锯齿线)</option>
            </select>
        </div>
        
        <div class="control-group">
            <button id="applyBtn">应用设置</button>
            <button id="refreshBtn" style="background: #2196F3;">刷新图表</button>
        </div>
    </div>

    <div id="main" style="width: 800px; height: 600px;"></div>

    <script>
        require.config({
            paths: {
                'echarts': '../../dist/echarts',
                'zrender': '../../node_modules/zrender/dist/zrender',
                'geoJson': '../../geoData/geoJson',
                'theme': '../../theme',
                'data': '../data',
                'map': '../data/map',
                'i18n': '../../i18n',
                'extension': '../../dist/extension',
                'ssrClient': '../../ssr/client/dist/index.js'
            }
        });

        require(['echarts'], function (echarts) {
            let chart = null;
            let currentRenderer = 'canvas';
            let currentRoughness = 2.6;
            let currentFiller = 'hachure';
            
            // 更新 roughness 显示值
            document.getElementById('roughness').addEventListener('input', function(e) {
                document.getElementById('roughnessValue').textContent = e.target.value;
            });
            
            // 创建图表
            function createChart() {
                if (chart) {
                    chart.dispose();
                }
                
                console.log('Creating chart with:', { 
                    renderer: currentRenderer, 
                    roughness: currentRoughness, 
                    filler: currentFiller 
                });
                
                chart = echarts.init(document.getElementById('main'), null, {
                    renderer: currentRenderer,
                    roughness: currentRoughness,
                    filler: currentFiller
                });
                
                const option = {
                    textStyle: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif'
                        },
                    title: {
                        text: '柱状图示例',
                        textStyle: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif'
                        }
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    legend: {
                        textStyle: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif'
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                        axisLabel: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif'
                        }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            fontFamily: 'JinNianYeYaoJiaYouYa, sans-serif'
                        }
                    },
                    series: [
                        {
                            name: '直接访问',
                            type: 'bar',
                            data: [320, 332, 301, 334, 390, 330, 320]
                        },
                        {
                            name: '邮件营销',
                            type: 'bar',
                            data: [120, 132, 101, 134, 90, 230, 210]
                        },
                        {
                            name: '联盟广告',
                            type: 'bar',
                            data: [220, 182, 191, 234, 290, 330, 310]
                        }
                    ]
                };
                
                chart.setOption(option);
                console.log('Chart created successfully');
            }
            
            // 应用设置
            document.getElementById('applyBtn').addEventListener('click', function() {
                currentRenderer = document.getElementById('renderer').value;
                currentRoughness = parseFloat(document.getElementById('roughness').value);
                currentFiller = document.getElementById('filler').value;
                
                createChart();
            });
            
            // 刷新图表
            document.getElementById('refreshBtn').addEventListener('click', function() {
                if (chart) {
                    chart.resize();
                }
            });
            
            // 初始化图表
            createChart();
        });
    </script>
</body>
</html>
