<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Roughness Debug Test</title>
    <script src="lib/simpleRequire.js"></script>
    <script src="lib/config.js"></script>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/facePrint.js"></script>
    <script src="lib/testHelper.js"></script>
    <link rel="stylesheet" href="lib/reset.css" />
</head>
<body>
    <style>
        html, body, #main {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        #main {
            background: #fff;
        }
        .debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>

    <div id="main"></div>
    <div class="debug-info" id="debugInfo">
        <div>Debug Info:</div>
        <div id="roughnessInfo">Roughness: Not set</div>
        <div id="rendererInfo">Renderer: Unknown</div>
        <div id="zrenderInfo">ZRender: Unknown</div>
    </div>

    <script>
        require([
            'echarts'
        ], function (echarts) {
            console.log('ECharts version:', echarts.version);
            console.log('ECharts dependencies:', echarts.dependencies);
            
            // 更新调试信息
            document.getElementById('zrenderInfo').textContent = 'ZRender: ' + echarts.dependencies.zrender;

            var option = {
                title: {
                    text: 'Roughness Debug Test'
                },
                xAxis: {
                    type: 'category',
                    data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    data: [120, 200, 150, 80, 70, 110, 130],
                    type: 'bar',
                    itemStyle: {
                        color: 'rgba(255, 0, 0, 0.5)'
                    }
                }]
            };

            // 测试不同的渲染器和 roughness 设置
            var tests = [
                { renderer: 'canvas', roughness: 0, title: 'Canvas - No Roughness' },
                { renderer: 'canvas', roughness: 5, title: 'Canvas - Roughness 5' },
                { renderer: 'svg', roughness: 0, title: 'SVG - No Roughness' },
                { renderer: 'svg', roughness: 5, title: 'SVG - Roughness 5' }
            ];

            var currentTest = 0;
            
            function runTest() {
                if (currentTest >= tests.length) {
                    console.log('All tests completed');
                    return;
                }
                
                var test = tests[currentTest];
                console.log('Running test:', test.title);
                
                // 清除之前的图表
                var mainDiv = document.getElementById('main');
                mainDiv.innerHTML = '';
                
                // 更新调试信息
                document.getElementById('roughnessInfo').textContent = 'Roughness: ' + test.roughness;
                document.getElementById('rendererInfo').textContent = 'Renderer: ' + test.renderer;
                
                try {
                    var chart = echarts.init(mainDiv, null, {
                        renderer: test.renderer,
                        roughness: test.roughness
                    });
                    
                    // 检查 ZRender 实例
                    console.log('Chart ZRender instance:', chart.getZr());
                    console.log('ZRender roughness:', chart.getZr().roughness);
                    console.log('ZRender filler:', chart.getZr().filler);
                    
                    var testOption = Object.assign({}, option, {
                        title: { text: test.title }
                    });
                    
                    chart.setOption(testOption);
                    
                    // 等待渲染完成后切换到下一个测试
                    setTimeout(() => {
                        currentTest++;
                        setTimeout(runTest, 2000); // 2秒后运行下一个测试
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error in test:', test.title, error);
                    currentTest++;
                    setTimeout(runTest, 1000);
                }
            }
            
            // 开始测试
            runTest();
        });
    </script>
</body>
</html>
